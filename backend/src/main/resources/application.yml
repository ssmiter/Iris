server:
  port: 5001

spring:
  application:
    name: iris-backend
  datasource:
    url: jdbc:sqlite:${user.home}/Iris/iris.db
  sql:
    init:
      mode: always

iris:
  workspace: ~/Iris/workspace
  sandbox:
    timeout-sec: 120
    output-limit-kb: 64
  proxy:
    # M0：填你的 OpenAI 兼容上游；密钥只放这里，绝不出现在响应中
    base-url: https://open.bigmodel.cn/api/paas/v4
    api-key: ${IRIS_API_KEY:}
    model: glm-4-plus

logging:
  level:
    com.iris: info
