server:
  port: 15001

spring:
  application:
    name: iris-backend
  webflux:
    multipart:
      max-disk-usage-per-part: 32MB
  datasource:
    url: jdbc:sqlite:${IRIS_DB_PATH:${user.home}/.iris.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

iris:
  workspace: ~/Iris/workspace
  agent:
    max-parallel-read-tools: ${IRIS_MAX_PARALLEL_READ_TOOLS:4}
  tools:
    approval-mode: ${IRIS_TOOL_APPROVAL_MODE:required}
  storage:
    object-root: ${IRIS_OBJECT_STORE_PATH:${user.home}/Iris/data/objects}
  sql:
    connections: {}
  webbridge:
    health-cache-ttl: 3s
    runtimes: {}
  sandbox:
    python:
      mode: ${IRIS_PYTHON_MODE:disabled}
      executable: ${IRIS_PYTHON_EXECUTABLE:python}
      run-root: ${IRIS_PYTHON_RUN_ROOT:${user.home}/Iris/data/python-runs}
      timeout-sec: ${IRIS_PYTHON_TIMEOUT_SECONDS:120}
      capture-limit-kb: ${IRIS_PYTHON_CAPTURE_LIMIT_KB:64}
      max-input-mb: ${IRIS_PYTHON_MAX_INPUT_MB:64}
      max-output-mb: ${IRIS_PYTHON_MAX_OUTPUT_MB:32}
  model:
    profile: ${IRIS_MODEL_PROFILE:unconfigured}
    kind: ${IRIS_MODEL_KIND:unconfigured}
    model-id: ${IRIS_MODEL_ID:}
    base-url: ${IRIS_MODEL_BASE_URL:}
    endpoint-path: ${IRIS_MODEL_ENDPOINT_PATH:/v1/chat/completions}
    api-key: ${IRIS_MODEL_API_KEY:}
    timeout-seconds: ${IRIS_MODEL_TIMEOUT_SECONDS:180}
    max-output-tokens: ${IRIS_MODEL_MAX_OUTPUT_TOKENS:8192}
    cumulative-tool-arguments: ${IRIS_MODEL_CUMULATIVE_TOOL_ARGUMENTS:false}

logging:
  level:
    com.iris: info
