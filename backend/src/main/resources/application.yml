server:
  port: 15001

spring:
  application:
    name: iris-backend
  webflux:
    multipart:
      max-disk-usage-per-part: 32MB
  datasource:
    url: jdbc:sqlite:${IRIS_DB_PATH:${user.home}/.iris.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
      data-source-properties:
        busy_timeout: 5000
        journal_mode: WAL
        synchronous: NORMAL
        foreign_keys: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

iris:
  workspace: ~/Iris/workspace
  agent:
    max-parallel-read-tools: ${IRIS_MAX_PARALLEL_READ_TOOLS:4}
    max-active-child-runs: ${IRIS_MAX_ACTIVE_CHILD_RUNS:3}
    compaction:
      warning-ratio: ${IRIS_COMPACTION_WARNING_RATIO:0.85}
      blocking-ratio: ${IRIS_COMPACTION_BLOCKING_RATIO:0.95}
    speculation:
      enabled: ${IRIS_AGENT_SPECULATION_ENABLED:true}
      max-parallel: ${IRIS_AGENT_SPECULATION_MAX_PARALLEL:2}
  retrieval:
    embedding:
      mode: ${IRIS_EMBEDDING_MODE:disabled}
      model-path: ${IRIS_EMBEDDING_MODEL_PATH:}
      vocab-path: ${IRIS_EMBEDDING_VOCAB_PATH:}
      identity: ${IRIS_EMBEDDING_IDENTITY:distiluse-multilingual-v1}
      max-tokens: ${IRIS_EMBEDDING_MAX_TOKENS:256}
      batch-size: ${IRIS_EMBEDDING_BATCH_SIZE:32}
    hybrid:
      lexical-weight: ${IRIS_RETRIEVAL_LEXICAL_WEIGHT:0.55}
      semantic-weight: ${IRIS_RETRIEVAL_SEMANTIC_WEIGHT:0.45}
      semantic-threshold: ${IRIS_RETRIEVAL_SEMANTIC_THRESHOLD:0.48}
  tools:
    approval-mode: ${IRIS_TOOL_APPROVAL_MODE:required}
  storage:
    object-root: ${IRIS_OBJECT_STORE_PATH:${user.home}/Iris/data/objects}
  model:
    # 活跃 profile：yml 默认 + app_setting 持久化的运行时选择（优先）。
    # 环境变量 IRIS_MODEL_PROFILE 同时充当 active 与 env profile 的开关。
    active: ${IRIS_MODEL_PROFILE:unconfigured}
    profiles:
      # env 占位：无 application-local.yml 时可用环境变量塞一份单 profile；
      # kind=unconfigured 时该条目被跳过、不注册。
      env:
        kind: ${IRIS_MODEL_KIND:unconfigured}
        model-id: ${IRIS_MODEL_ID:}
        base-url: ${IRIS_MODEL_BASE_URL:}
        endpoint-path: ${IRIS_MODEL_ENDPOINT_PATH:/v1/chat/completions}
        api-key: ${IRIS_MODEL_API_KEY:}
        timeout-seconds: ${IRIS_MODEL_TIMEOUT_SECONDS:180}
        max-output-tokens: ${IRIS_MODEL_MAX_OUTPUT_TOKENS:8192}
        cumulative-tool-arguments: ${IRIS_MODEL_CUMULATIVE_TOOL_ARGUMENTS:false}

logging:
  level:
    com.iris: info
