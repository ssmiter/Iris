name: close_browser_session
kind: process
description: 关闭一个短期 BrowserSession 并释放其页面与 CDP handle；网页任务完成且不再需要人工接管时使用
input_schema:
  type: object
  properties:
    runtime_id:
      type: string
      description: 可选定向 Runtime ID；缺省由默认 Runtime 解析
    session_id:
      type: string
      description: 要关闭的短期 BrowserSession ID
  required: [session_id]
  additionalProperties: false
risk:
  level: standard
  side_effect: external_write
approval:
  mode: explicit
  impact_statement: 将关闭浏览器会话 {session_id} 并释放其全部页面；未保存的页面状态随之消失
runtime:
  entry: ["{javaBin}", "{pluginDir}/Browser.java"]
limits:
  timeout_ms: 30000
  max_result_chars: 4000
search_hint: 浏览器 会话 关闭 释放
