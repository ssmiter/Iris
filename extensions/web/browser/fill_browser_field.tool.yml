name: fill_browser_field
kind: process
description: 填写当前页面观察中的普通文本字段，并重读值和页面状态；密码、文件及不可安全确认的字段会被拒绝（这类输入请用 ask_user 请用户人工完成）
input_schema:
  type: object
  properties:
    runtime_id:
      type: string
      description: 可选定向 Runtime ID；缺省由默认 Runtime 解析
    session_id:
      type: string
      description: 当前短期 BrowserSession ID
    page_id:
      type: string
      description: 当前 BrowserPage ID
    observation_ref:
      type: string
      description: 最近一次页面观察 ref；动作仅在页面仍处于该观察时执行
    element_ref:
      type: string
      description: 同一 observation 内的普通文本字段 ref
    value:
      type: string
      maxLength: 20000
      description: 要填写的非秘密文本；清空字段传空字符串
  required: [session_id, page_id, observation_ref, element_ref, value]
  additionalProperties: false
risk:
  level: elevated
  side_effect: external_write
approval:
  mode: explicit
  impact_statement: 将在浏览器会话 {session_id} 页面 {page_id} 的字段 {element_ref} 填写文本（最长 20000 字符）；仅当页面仍处于观察 {observation_ref} 时执行，随后重读字段确认
runtime:
  entry: ["{javaBin}", "{pluginDir}/Browser.java"]
limits:
  timeout_ms: 60000
  max_result_chars: 80000
search_hint: 浏览器 填写 输入 表单 字段 文本
