name: navigate_browser_history
kind: process
description: 让当前 BrowserPage 按真实浏览历史后退、前进或刷新，并返回动作后观察；需要回到搜索结果、恢复前一页或刷新当前页时使用
input_schema:
  type: object
  properties:
    runtime_id:
      type: string
      description: 可选定向 Runtime ID；缺省由默认 Runtime 解析
    session_id:
      type: string
      description: 当前短期 BrowserSession ID
    page_id:
      type: string
      description: 当前 BrowserPage ID
    observation_ref:
      type: string
      description: 最近一次页面观察 ref；动作仅在页面仍处于该观察时执行
    direction:
      type: string
      enum: [back, forward, reload]
      description: 后退、前进或刷新
  required: [session_id, page_id, observation_ref, direction]
  additionalProperties: false
risk:
  level: standard
  side_effect: external_write
approval:
  mode: explicit
  impact_statement: 将在浏览器会话 {session_id} 的页面 {page_id} 执行"{direction}"历史动作；仅当页面仍处于观察 {observation_ref} 时执行
runtime:
  entry: ["{javaBin}", "{pluginDir}/Browser.java"]
limits:
  timeout_ms: 60000
  max_result_chars: 80000
search_hint: 浏览器 后退 前进 刷新 历史
