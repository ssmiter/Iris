name: query_mes_mould_status
kind: process
description: 查询 MES 域的模具状态、当前位置、累计使用和维护阈值；判断某制品模具是否可用于排产或是否临近维护时使用
input_schema:
  type: object
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 200
      description: 最多返回记录数；默认 50，上限 200
    query:
      type: string
      description: 模具编码或名称片段
    process_code:
      type: string
      description: 适用工序编码，精确匹配
    status:
      type: string
      description: 对象状态，精确匹配；先不传可观察当前状态值
  additionalProperties: false
risk:
  level: read_only
  side_effect: none
approval:
  mode: auto
runtime:
  entry: ["{javaBin}", "-cp", "{pluginDir}/../../lib/*", "{pluginDir}/../../Mes.java"]
limits:
  timeout_ms: 30000
  max_result_chars: 40000
search_hint: 模具 状态 位置 累计使用 维护阈值
