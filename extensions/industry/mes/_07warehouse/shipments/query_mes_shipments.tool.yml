name: query_mes_shipments
kind: process
description: 查询 MES 域的成品发运记录（方向、车位、包数、关联需求）；核对交付与发运进度时使用，不包含库存台账（见 query_mes_finished_goods_inventory_movements）
input_schema:
  type: object
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 200
      description: 最多返回记录数；默认 50，上限 200
    record_type:
      type: string
      enum: [shipment]
      description: 记录类型：shipment=发运；不传则返回全部类型
    start_date:
      type: string
      description: 业务开始日期 YYYY-MM-DD；不传则不设下界
    end_date:
      type: string
      description: 业务结束日期 YYYY-MM-DD；不传则不设上界
    item:
      type: string
      description: 物料或制品编码、名称片段
    resource_code:
      type: string
      description: 发货月台编码，精确匹配
    status:
      type: string
      description: 业务状态，精确匹配；先不传可观察当前数据中的状态值
  additionalProperties: false
risk:
  level: read_only
  side_effect: none
approval:
  mode: auto
runtime:
  entry: ["{javaBin}", "-cp", "{pluginDir}/../../lib/*", "{pluginDir}/../../Mes.java"]
limits:
  timeout_ms: 30000
  max_result_chars: 40000
search_hint: 成品 发运 交付 车位 包数 需求 月台
