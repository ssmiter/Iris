name: query_mes_mixing_plans
kind: process
description: 查询 MES 域的密炼计划、班次、优先级与实际完成进度；判断计划执行情况时使用
input_schema:
  type: object
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 200
      description: 最多返回记录数；默认 50，上限 200
    start_date:
      type: string
      description: 计划开始日期 YYYY-MM-DD；不传则不设下界
    end_date:
      type: string
      description: 计划结束日期 YYYY-MM-DD；不传则不设上界
    equipment_code:
      type: string
      description: 密炼设备编码，精确匹配
    material_code:
      type: string
      description: 胶料编码，精确匹配
    status:
      type: string
      enum: [scheduled, running, completed, paused]
      description: 计划状态：scheduled、running、completed 或 paused
  additionalProperties: false
risk:
  level: read_only
  side_effect: none
approval:
  mode: auto
runtime:
  entry: ["{javaBin}", "-cp", "{pluginDir}/../../lib/*", "{pluginDir}/../../Mes.java"]
limits:
  timeout_ms: 30000
  max_result_chars: 40000
search_hint: 密炼 计划 班次 优先级 进度 排产 胶料
