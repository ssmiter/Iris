name: query_mes_mixing_equipment_events
kind: process
description: 查询 MES 域的密炼设备停机、降速与过程告警事件；定位损失时间和未闭环异常时使用
input_schema:
  type: object
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 200
      description: 最多返回记录数；默认 50，上限 200
    start_date:
      type: string
      description: 事件开始日期 YYYY-MM-DD；不传则不设下界
    end_date:
      type: string
      description: 事件结束日期 YYYY-MM-DD；不传则不设上界
    equipment_code:
      type: string
      description: 密炼设备编码，精确匹配
    severity:
      type: string
      enum: [info, low, medium, high]
      description: 严重度：info、low、medium 或 high
    unresolved_only:
      type: boolean
      description: 是否只返回尚未闭环的事件；默认 false
  additionalProperties: false
risk:
  level: read_only
  side_effect: none
approval:
  mode: auto
runtime:
  entry: ["{javaBin}", "-cp", "{pluginDir}/../../lib/*", "{pluginDir}/../../Mes.java"]
limits:
  timeout_ms: 30000
  max_result_chars: 40000
search_hint: 密炼 设备 停机 降速 告警 事件 损失 异常
