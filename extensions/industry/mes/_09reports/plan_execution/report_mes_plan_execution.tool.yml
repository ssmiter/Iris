name: report_mes_plan_execution
kind: process
description: 按工序与日期聚合 MES 域的计划量、完成量与达成率，附合计；做计划执行日报或评估达成情况时使用
input_schema:
  type: object
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 200
      description: 最多返回记录数；默认 50，上限 200
    start_date:
      type: string
      description: 统计开始日期 YYYY-MM-DD；不传则不设下界
    end_date:
      type: string
      description: 统计结束日期 YYYY-MM-DD；不传则不设上界
    process_code:
      type: string
      enum: [mixing, forming, curing]
      description: 工序；不传则覆盖全部工序
  additionalProperties: false
risk:
  level: read_only
  side_effect: none
approval:
  mode: auto
runtime:
  entry: ["{javaBin}", "-cp", "{pluginDir}/../../lib/*", "{pluginDir}/../../Mes.java"]
limits:
  timeout_ms: 30000
  max_result_chars: 40000
search_hint: 计划执行 日报 达成率 完成量 工序 报表
