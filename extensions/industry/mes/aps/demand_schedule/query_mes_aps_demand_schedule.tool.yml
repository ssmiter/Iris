name: query_mes_aps_demand_schedule
kind: process
description: 查询 MES 域的排产需求与跨工序计划结果；比较需求数量、可行排程、瓶颈和预计完成时间时使用，不执行重新排产或发布计划
input_schema:
  type: object
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 200
      description: 最多返回记录数；默认 50，上限 200
    record_type:
      type: string
      enum: [demand, schedule]
      description: 记录类型：demand 表示待满足需求，schedule 表示计算后的排程结果；不传则返回全部类型
    start_date:
      type: string
      description: 业务开始日期 YYYY-MM-DD；不传则不设下界
    end_date:
      type: string
      description: 业务结束日期 YYYY-MM-DD；不传则不设上界
    item:
      type: string
      description: 物料或制品编码、名称片段
    resource_code:
      type: string
      description: 排程资源组或产线组编码，精确匹配
    status:
      type: string
      description: 业务状态，精确匹配；先不传可观察当前数据中的状态值
  additionalProperties: false
risk:
  level: read_only
  side_effect: none
approval:
  mode: auto
runtime:
  entry: ["{javaBin}", "-cp", "{pluginDir}/../../lib/*", "{pluginDir}/../../Mes.java"]
limits:
  timeout_ms: 30000
  max_result_chars: 40000
search_hint: APS 排产 需求 排程 瓶颈 预计完成
