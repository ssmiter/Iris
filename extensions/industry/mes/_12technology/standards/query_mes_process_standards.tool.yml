name: query_mes_process_standards
kind: process
description: 查询 MES 域的工艺标准版本与关键参数摘要；确认工艺窗口或比对现场执行参数时使用
input_schema:
  type: object
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 200
      description: 最多返回记录数；默认 50，上限 200
    query:
      type: string
      description: 工艺标准编码或名称片段
    process_code:
      type: string
      description: 适用工序编码，精确匹配
    status:
      type: string
      description: 对象状态，精确匹配；先不传可观察当前状态值
  additionalProperties: false
risk:
  level: read_only
  side_effect: none
approval:
  mode: auto
runtime:
  entry: ["{javaBin}", "-cp", "{pluginDir}/../../lib/*", "{pluginDir}/../../Mes.java"]
limits:
  timeout_ms: 30000
  max_result_chars: 40000
search_hint: 工艺标准 版本 参数 窗口 执行
