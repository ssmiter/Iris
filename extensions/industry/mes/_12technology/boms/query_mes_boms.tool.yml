name: query_mes_boms
kind: process
description: 查询 MES 域的产品与半制品 BOM 组成；核算物料需求或排查用料差异时使用
input_schema:
  type: object
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 200
      description: 最多返回记录数；默认 50，上限 200
    query:
      type: string
      description: BOM编码或名称片段
    process_code:
      type: string
      description: 适用工序编码，精确匹配
    status:
      type: string
      description: 对象状态，精确匹配；先不传可观察当前状态值
  additionalProperties: false
risk:
  level: read_only
  side_effect: none
approval:
  mode: auto
runtime:
  entry: ["{javaBin}", "-cp", "{pluginDir}/../../lib/*", "{pluginDir}/../../Mes.java"]
limits:
  timeout_ms: 30000
  max_result_chars: 40000
search_hint: BOM 组成 物料需求 用料 差异
