name: query_mes_process_recipes
kind: process
description: 查询 MES 域的配方版本、启用状态、适用工序和关键摘要；核对生产使用哪个配方或版本是否批准时使用，不返回真实配比明细
input_schema:
  type: object
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 200
      description: 最多返回记录数；默认 50，上限 200
    query:
      type: string
      description: 配方编码或名称片段
    process_code:
      type: string
      description: 适用工序编码，精确匹配
    status:
      type: string
      description: 对象状态，精确匹配；先不传可观察当前状态值
  additionalProperties: false
risk:
  level: read_only
  side_effect: none
approval:
  mode: auto
runtime:
  entry: ["{javaBin}", "-cp", "{pluginDir}/../../lib/*", "{pluginDir}/../../Mes.java"]
limits:
  timeout_ms: 30000
  max_result_chars: 40000
search_hint: 配方 版本 启用 批准 工序
